<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearDay Nagpur - Weather Panel</title>
    <style>
        /* ==============================
           Global Styles & Colors
           ============================== */
        :root {
            /* Palette optimized for clarity and atmosphere */
            --bg-start: #1e3a8a; /* Deep blue dusk */
            --bg-end: #60a5fa;   /* Bright daylight blue */
            --glass-bg: rgba(255, 255, 255, 0.06); /* Highly transparent */
            --glass-border: rgba(255, 255, 255, 0.12); /* Subtle edge */
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-sun: #fbbf24; /* Warm gold/yellow */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif; /* Cleaner modern font */
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Dynamic gradient background */
            background: linear-gradient(160deg, var(--bg-start) 0%, var(--bg-end) 100%);
            overflow: hidden; /* Prevent scrollbars from blur effect */
            position: relative;
        }

        /* Adds blurred background decorative blobs for depth */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(125, 211, 252, 0.3); /* Lighter blue blob */
            border-radius: 50%;
            top: 10%;
            left: 15%;
            filter: blur(80px);
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(251, 191, 36, 0.15); /* Soft sun blob */
            border-radius: 50%;
            bottom: 5%;
            right: 10%;
            filter: blur(100px);
            z-index: 1;
        }

        /* ==============================
           Glass Panel Main Container
           ============================== */
        .weather-glass-panel {
            position: relative;
            z-index: 10; /* Sits above the blurred blobs */
            background: var(--glass-bg);
            /* This is the key Glassmorphism effect: blur background behind the element */
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); /* For Safari */
            
            padding: 3rem 2rem;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 360px;
            color: var(--text-primary);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Add a subtle lift animation on hover */
        .weather-glass-panel:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        /* ==============================
           Location Section
           ============================== */
        .location-group h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.2rem;
        }

        .location-group p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        /* ==============================
           Creative Icon Animation
           ============================== */
        .main-icon-container {
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
        }

        /* Custom SVG Animated Clear Sky Icon */
        .sunny-icon {
            width: 120px;
            height: 120px;
            fill: var(--accent-sun);
            filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.6)); /* Glowing effect */
            animation: sun-pulse 4s infinite ease-in-out;
        }

        /* Gentle pulse/rotation for the sun */
        @keyframes sun-pulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.05) rotate(5deg); opacity: 0.9; }
        }

        /* ==============================
           Temperature Display
           ============================== */
        .temp-group {
            margin-bottom: 3rem;
        }

        .temp-group .main-temp {
            font-size: 6rem;
            font-weight: 200; /* Ultra thin light weight */
            line-height: 1;
            position: relative;
            display: inline-block;
        }

        /* The degree symbol stack */
        .temp-group .main-temp span.unit {
            font-size: 2.5rem;
            font-weight: 400;
            position: absolute;
            top: 15px;
            right: -35px;
        }

        .temp-group .weather-desc {
            font-size: 1.3rem;
            font-weight: 500;
            margin-top: 0.5rem;
            letter-spacing: 0.5px;
        }

        /* ==============================
           Detailed Info Grid (Glassy)
           ============================== */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            border-top: 1px solid var(--glass-border);
            padding-top: 2rem;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 15px;
            display: flex;
            align-items: center;
            text-align: left;
            transition: background 0.3s ease;
        }

        .detail-card:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* SVG Icons in the details grid */
        .detail-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-secondary);
            margin-right: 12px;
        }

        .detail-data {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.1rem;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

    </style>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="weather-glass-panel">
        <div class="location-group">
            <h1>Nagpur</h1>
            <p>MAHARASHTRA</p>
        </div>

        <div class="main-icon-container">
            <svg class="sunny-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2v1M12 21v1M4.22 4.22l.71.71M18.36 18.36l.71.71M2 12h1M21 12h1M4.22 19.78l.71-.71M18.36 5.64l.71-.71M12 7a5 5 0 100 10 5 5 0 000-10zm0 8a3 3 0 110-6 3 3 0 010 6z"/>
            </svg>
        </div>

        <div class="temp-group">
            <h2 class="main-temp">31<span class="unit">°C</span></h2>
            <p class="weather-desc">Clear Sky</p>
        </div>

        <div class="details-grid">
            <div class="detail-card">
                <svg class="detail-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 21.5c-3.5 0-6.3-2.8-6.3-6.3a6.3 6.3 0 011.6-4.2C8.7 9 11.5 5 12 4c.5 1 3.3 5 4.7 6.7 1.1 1.3 1.6 2.7 1.6 4.2 0 3.5-2.8 6.3-6.3 6.3zm0-15s-2 2.7-3.6 4.6a4.3 4.3 0 00-1.1 3 4.7 4.7 0 109.4 0 4.3 4.3 0 00-1.1-3C14 9.2 12 6.5 12 6.5z"/>
                </svg>
                <div class="detail-data">
                    <span class="detail-label">Humidity</span>
                    <span class="detail-value">45%</span>
                </div>
            </div>

            <div class="detail-card">
                <svg class="detail-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.6 15.6l-1.4-1.4 1.3-1.3C19.7 11.7 20 10.9 20 10c0-1.7-1.3-3-3-3s-3 1.3-3 3v2h-2v-2c0-2.8 2.2-5 5-5s5 2.2 5 5c0 1.4-.6 2.8-1.5 3.7l-1.9 1.9zm-6-2.6H2v-2h8.6c1 0 1.9-.8 1.9-1.9 0-1.1-.8-1.9-1.9-1.9-1.1 0-1.9.8-1.9 1.9H6.7c0-2.2 1.8-4 3.9-4s4 1.8 4 4c0 1.7-1.1 3.1-2.6 3.8H12.6zm-1.1 4H2v2h7.5c1.4.9 2 2.6 1.4 4.1-.7 1.6-2.5 2.3-4.1 1.6-1-.5-1.7-1.5-1.7-2.6h2c0 1.1.9 1.9 1.9 1.9 1.1 0 1.9-.9 1.9-1.9s-.9-2-1.9-2H11.5z"/>
                </svg>
                <div class="detail-data">
                    <span class="detail-label">Wind</span>
                    <span class="detail-value">12 km/h</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
